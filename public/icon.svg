<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a170e"/>
      <stop offset="60%" stop-color="#140d08"/>
      <stop offset="100%" stop-color="#070504"/>
    </radialGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="favAmber" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Circular Badge -->
  <circle cx="256" cy="256" r="248" fill="url(#favBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#favGold)" stroke-width="14"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#favGold)" stroke-width="3" stroke-dasharray="6 8" opacity="0.6"/>

  <!-- Rising Aroma Steam Ribbons -->
  <!-- Center Steam -->
  <path d="M 256 168 C 248 136 264 104 254 74 C 246 54 256 36 258 28 C 260 36 268 54 260 74 C 270 104 254 136 262 168 Z" fill="url(#favGold)"/>
  <!-- Left Steam -->
  <path d="M 216 166 C 206 142 216 116 206 94 C 200 78 208 64 210 58 C 212 64 218 80 212 96 C 222 118 212 144 222 166 Z" fill="url(#favAmber)" opacity="0.85"/>
  <!-- Right Steam -->
  <path d="M 296 166 C 306 142 296 116 306 94 C 312 78 304 64 302 58 C 300 64 294 80 300 96 C 290 118 300 144 290 166 Z" fill="url(#favAmber)" opacity="0.85"/>

  <!-- Artisanal Coffee Cup Body -->
  <path d="M 160 190 L 352 190 C 352 190 346 280 306 314 C 278 338 234 338 206 314 C 166 280 160 190 160 190 Z" fill="url(#favAmber)"/>
  
  <!-- Cup Liquid Rim -->
  <ellipse cx="256" cy="190" rx="96" ry="18" fill="#2d1307" stroke="url(#favGold)" stroke-width="4"/>
  <ellipse cx="256" cy="190" rx="84" ry="12" fill="#140803"/>

  <!-- Cup Handle -->
  <path d="M 346 206 C 382 206 398 226 398 248 C 398 274 374 292 338 294" fill="none" stroke="url(#favGold)" stroke-width="14" stroke-linecap="round"/>

  <!-- Saucer Plate -->
  <path d="M 140 336 Q 256 364 372 336 Q 256 348 140 336 Z" fill="url(#favGold)"/>
  <line x1="160" y1="340" x2="352" y2="340" stroke="url(#favGold)" stroke-width="6" stroke-linecap="round"/>

  <!-- Coffee Bean Emblem in Center of Cup -->
  <g transform="translate(256, 256) scale(1.3)">
    <path d="M -2 -22 C -18 -22 -26 -8 -26 8 C -26 22 -16 32 -2 32 C -4 22 -7 10 -5 0 C -3 -10 -4 -18 -2 -22 Z" fill="#2a1207"/>
    <path d="M 2 -22 C 18 -22 26 -8 26 8 C 26 22 16 32 2 32 C 4 22 7 10 5 0 C 3 -10 4 -18 2 -22 Z" fill="#2a1207"/>
    <path d="M -2 -22 C 4 -10 5 8 -2 32" fill="none" stroke="url(#favGold)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Monogram "A" Lettermark Base -->
  <text x="256" y="440" 
        font-family="'Playfair Display', 'Cinzel', Georgia, serif" 
        font-size="68" 
        font-weight="900" 
        letter-spacing="6" 
        fill="url(#favGold)" 
        text-anchor="middle">AROMA</text>
</svg>
